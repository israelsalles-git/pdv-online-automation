[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts =
    -ra
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
markers =
    api: testes de API REST (requests)
    ui: testes de interface web (Selenium + Page Objects)
    fiscal: validação de XML de NFC-e (lxml)
    smoke: verificação rápida dos fluxos críticos
    regression: suíte completa de regressão
