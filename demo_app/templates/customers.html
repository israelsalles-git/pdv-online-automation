{% extends "base.html" %}
{% block title %}Clientes - PDV Demo{% endblock %}
{% block content %}
<h1 id="page-title">Clientes</h1>

<form method="get" action="{{ url_for('customers_page') }}" id="search-form">
  <input id="search-input" name="q" value="{{ q }}" placeholder="Buscar por nome ou documento">
  <button id="search-button" type="submit">Buscar</button>
</form>

<h2>Novo cliente</h2>
<form method="post" action="{{ url_for('customers_save') }}" id="customer-form">
  <input id="customer-name" name="name" placeholder="Nome">
  <input id="customer-document" name="document" placeholder="CPF/CNPJ">
  <input id="customer-email" name="email" placeholder="E-mail">
  <button id="save-customer" type="submit">Salvar</button>
</form>

<table id="customers-table">
  <thead><tr><th>Nome</th><th>Documento</th><th>E-mail</th></tr></thead>
  <tbody>
  {% for c in customers %}
    <tr data-name="{{ c.name }}">
      <td class="name">{{ c.name }}</td>
      <td class="document">{{ c.document }}</td>
      <td class="email">{{ c.email }}</td>
    </tr>
  {% else %}
    <tr id="empty-row"><td colspan="3">Nenhum cliente encontrado</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
