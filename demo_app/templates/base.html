<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>{% block title %}PDV Demo{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
    header { background: #1f3a5f; color: #fff; padding: 12px 24px; display: flex; gap: 20px; align-items: center; }
    header a { color: #cfe3ff; text-decoration: none; }
    .badge { margin-left: auto; font-size: 12px; background: #b45309; padding: 2px 8px; border-radius: 4px; }
    main { max-width: 900px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e4e7eb; }
    input, select, button { padding: 6px 10px; margin: 4px 4px 4px 0; }
    form.inline { display: inline; }
    .alert { padding: 8px 12px; border-radius: 4px; margin: 12px 0; }
    .alert.success { background: #dcfce7; color: #166534; }
    .alert.error { background: #fee2e2; color: #991b1b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  {% if session.get("user") %}
  <header>
    <strong>PDV Demo</strong>
    <a id="nav-dashboard" href="{{ url_for('dashboard') }}">Dashboard</a>
    <a id="nav-products" href="{{ url_for('products_page') }}">Produtos</a>
    <a id="nav-customers" href="{{ url_for('customers_page') }}">Clientes</a>
    <a id="nav-sales" href="{{ url_for('sales_page') }}">Venda</a>
    <a id="logout" href="{{ url_for('logout') }}">Sair</a>
    <span class="badge">AMBIENTE DE DEMONSTRAÇÃO</span>
  </header>
  {% endif %}
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, text in messages %}
        <div id="{{ 'message' if category == 'success' else 'form-error' }}" class="alert {{ category }}">{{ text }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
